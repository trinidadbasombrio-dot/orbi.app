<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ORBI - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">ORBI</div>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Favoritos</a></li>
                <li><a href="#">Notificaciones</a></li>
                <li><a href="#">Perfil</a></li>
                <li><a href="#">Configuraciones</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="search-container">
            <div class="search-bar">
                <img src="search-icon.png" alt="Buscar" class="icon">
                <input type="text" placeholder="busca tu destino...">
            </div>
        </section>

        <section class="grid-gallery">
            <div class="column">
                <img src="modelo.jpg" alt="Destino 1">
                <img src="comida.jpg" alt="Comida">
            </div>
            
            <div class="column">
                <img src="pagoda.jpg" alt="Japón">
                <img src="ciudad-aerea.jpg" alt="Vista Aérea">
                <img src="hotel-palmeras.jpg" alt="Resort">
            </div>

            <div class="column central">
                <img src="estatua-libertad.jpg" alt="Nueva York">
            </div>

            <div class="column">
                <img src="noche-palmeras.jpg" alt="Noche">
                <img src="cristo.jpg" alt="Brasil">
                <img src="favela.jpg" alt="Ciudad">
            </div>

            <div class="column">
                <img src="moda.jpg" alt="Moda">
            </div>
        </section>
    </main>

</body>
</html>.
